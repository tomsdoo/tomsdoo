name: Generate metrics
permissions:
  contents: write

on:
  schedule: [{ cron: "0 0 * * *" }] 
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate profile metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.svg
          user: tomsdoo
          template: classic
          base: header, activity, community
          config_timezone: Asia/Tokyo

          plugin_introduction: no
          plugin_introduction_title: no

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: no
          plugin_languages_indepth: no
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css

          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_sort: stars
          plugin_topics_limit: 16

          plugin_followup: no
          plugin_followup_sections: repositories, user

          plugin_repositories: no
          plugin_repositories_pinned: no
          plugin_repositories_filter: owner
          plugin_repositories_starred: no

